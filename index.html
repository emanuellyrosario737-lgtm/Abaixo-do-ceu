<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Abaixo do Céu</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         FUNDO MÍSTICO
    ========================== -->

    <div class="universe">

        <!-- NEBLINAS -->

        <div class="mist mist-1"></div>
        <div class="mist mist-2"></div>
        <div class="mist mist-3"></div>
        <div class="mist mist-4"></div>


        <!-- TEXTURA -->

        <div class="texture"></div>

    </div>



    <!-- =========================
         ESTRELAS
    ========================== -->

    <div class="stars">

        <span class="star star-1">✦</span>
        <span class="star star-2">✧</span>
        <span class="star star-3">✶</span>
        <span class="star star-4">✦</span>
        <span class="star star-5">⋆</span>
        <span class="star star-6">✧</span>
        <span class="star star-7">✦</span>
        <span class="star star-8">✷</span>
        <span class="star star-9">⋆</span>
        <span class="star star-10">✦</span>
        <span class="star star-11">✧</span>
        <span class="star star-12">✶</span>
        <span class="star star-13">✦</span>
        <span class="star star-14">⋆</span>
        <span class="star star-15">✧</span>
        <span class="star star-16">✦</span>
        <span class="star star-17">✶</span>
        <span class="star star-18">✧</span>
        <span class="star star-19">✦</span>
        <span class="star star-20">⋆</span>

    </div>



    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <nav>

            <a
                href="index.html"
                class="logo"
            >

                Abaixo do Céu

            </a>


            <div class="menu">

                <a href="textos.html">
                    Textos
                </a>

                <a href="imagens.html">
                    Imagens
                </a>

                <a href="sobre.html">
                    Sobre mim
                </a>

                <a href="redes.html">
                    Redes sociais
                </a>

            </div>

        </nav>

    </header>



    <!-- =========================
         PÁGINA INICIAL
    ========================== -->

    <main>

        <section class="hero">


            <!-- MADE OF STARDUST -->

            <div class="stardust">

                Made of Stardust

            </div>



            <!-- TÍTULO -->

            <div class="hero-content">

                <h1>

                    Abaixo

                    <span>
                        do Céu
                    </span>

                </h1>


                <p class="subtitle">

                    Gigante pela própria natureza,
                    mas por que não estamos vivendo
                    como um?

                </p>

            </div>



            <!-- SATURNO -->

            <div class="saturn">

                <div class="saturn-body"></div>

                <div class="saturn-ring"></div>

            </div>



            <!-- SÍMBOLOS -->

            <span class="moon-symbol moon-1">
                ☾
            </span>

            <span class="moon-symbol moon-2">
                ✧
            </span>

            <span class="moon-symbol moon-3">
                ⋆
            </span>

            <span class="moon-symbol moon-4">
                ✦
            </span>


        </section>

    </main>



    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>

        <p>
            Abaixo do Céu
        </p>

        <span>
            Made of Stardust
        </span>

    </footer>



    <script src="script.js"></script>

</body>

</html>
