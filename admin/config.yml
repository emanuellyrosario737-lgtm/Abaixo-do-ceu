backend:
  name: github
  repo: emanuelly
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "textos"
    label: "Textos"
    folder: "content/textos"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"

      - label: "Data"
        name: "date"
        widget: "datetime"

      - label: "Categoria"
        name: "category"
        widget: "string"

      - label: "Imagem"
        name: "image"
        widget: "image"
        required: false

      - label: "Texto"
        name: "body"
        widget: "markdown"

  - name: "capturas"
    label: "Capturas"
    folder: "content/capturas"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Título"
        name: "title"
        widget: "string"

      - label: "Data"
        name: "date"
        widget: "datetime"

      - label: "Imagem"
        name: "image"
        widget: "image"

      - label: "Descrição"
        name: "description"
        widget: "text"
        required: false
